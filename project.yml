# XcodeGen spec: CI runs `xcodegen generate` to get HTS.xcodeproj (not kept in git)
name: HTS
options:
  bundleIdPrefix: ru.hts
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru

packages:
  HTSCore:
    path: HTSCore

targets:
  HTS:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HTSCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HTS
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Documents (logs, later the clients) show up in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.hts.launcher
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme: {}
