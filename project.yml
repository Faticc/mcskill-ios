# XcodeGen spec: CI runs `xcodegen generate` to get HTS.xcodeproj (not kept in git)
name: HTS
options:
  bundleIdPrefix: ru.hts
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru

packages:
  HTSCore:
    path: HTSCore

targets:
  HTS:
    type: application
    platform: iOS
    sources:
      - App
      # StikDebug scripts: UniversalJIT26.js is exported to Documents/JIT, the extension is sent at JVM start
      - path: Resources/JIT
        buildPhase: resources
    dependencies:
      - package: HTSCore
    info:
      path: App/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleInfoDictionaryVersion: "6.0"
        LSRequiresIPhoneOS: true
        CFBundleDisplayName: HTS
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        # Landscape and full screen like the game and the Android launcher
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Inter, as in the Android app (scripts/import_android_assets.py)
        UIAppFonts:
          - inter_regular.ttf
          - inter_medium.ttf
          - inter_semibold.ttf
          - inter_bold.ttf
        # Documents (logs, later the clients) show up in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # SDL: mouse and trackpad input on iPad/iPhone with a pointer
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.hts.launcher
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # HTSJava (Objective-C, the JVM and JIT side) and the JNI headers it builds against
        SWIFT_OBJC_BRIDGING_HEADER: App/HTS-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/App/Native $(SRCROOT)/App/Native/include
        # SDL3, ANGLE, gl4es, LWJGL natives go to Frameworks (scripts/pack-game-libs.sh) and find each other by @rpath
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    scheme: {}
