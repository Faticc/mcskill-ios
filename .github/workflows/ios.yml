name: iOS

on:
  # Branches only: tags (release deps-N) must not start a build
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install protobuf xcodegen ldid ninja
          xcodebuild -version
          swift --version
          /opt/homebrew/bin/protoc --version

      - name: Core tests (swift test)
        run: swift test --package-path HTSCore 2>&1 | tee core-tests.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDL3 cache
        uses: actions/cache@v4
        with:
          path: build/sdl-out
          key: sdl-3.4.16-${{ hashFiles('sdl/**', 'scripts/build-sdl.sh') }}

      - name: Game libraries cache
        uses: actions/cache@v4
        with:
          path: game-cache
          key: game-libs-v1

      # SDL3 with our UIKit/ANGLE layer for device and simulator, and the render test program
      - name: Game libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build/sdl-out/device/libSDL3.dylib ] || bash scripts/build-sdl.sh device build/sdl-out/device
          [ -f build/sdl-out/simulator/libSDL3.dylib ] || bash scripts/build-sdl.sh simulator build/sdl-out/simulator
          mkdir -p game-cache build/gltest/classes build/gltest/lwjgl
          [ -s game-cache/lwjgl-3.4.1-ios.tar.gz ] || gh release download deps-1 -R Faticc/mcskill-ios -p lwjgl-3.4.1-ios.tar.gz -D game-cache
          tar -xzf game-cache/lwjgl-3.4.1-ios.tar.gz -C build/gltest/lwjgl
          javac --release 17 -cp "$(ls build/gltest/lwjgl/jars/*.jar | paste -sd: -)" -d build/gltest/classes tests/gltest/HtsGLTest.java
          jar cf build/gltest/gltest.jar -C build/gltest/classes .
          # SDLVideo with the HTS hooks (lwjgl-patch/README.md), first on the classpath of SDL packs
          [ -s game-cache/jspecify-1.0.0.jar ] || curl -fsSL -o game-cache/jspecify-1.0.0.jar https://repo1.maven.org/maven2/org/jspecify/jspecify/1.0.0/jspecify-1.0.0.jar
          mkdir -p build/gltest/patch
          javac --release 8 -encoding UTF-8 -nowarn -cp "$(ls build/gltest/lwjgl/jars/*.jar | paste -sd: -):game-cache/jspecify-1.0.0.jar" -d build/gltest/patch $(find lwjgl-patch/src -name '*.java')
          jar cf build/gltest/hts-lwjgl-patch.jar -C build/gltest/patch .

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild -project HTS.xcodeproj -scheme HTS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            -skipPackagePluginValidation -skipMacroValidation \
            build 2>&1 | tee sim-build.log | grep -E "error:|warning: .*HTS|BUILD" || true
          test -f build/sim/Build/Products/Debug-iphonesimulator/HTS.app/HTS
          plutil -p build/sim/Build/Products/Debug-iphonesimulator/HTS.app/Info.plist

      - name: Simulator screenshots
        run: bash scripts/sim-screenshots.sh build/sim/Build/Products/Debug-iphonesimulator/HTS.app screenshots

      - name: JRE cache
        uses: actions/cache@v4
        with:
          path: jre-cache
          key: jre-ios-8-17-25-v1

      - name: Build unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xcodebuild -project HTS.xcodeproj -scheme HTS -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee device-build.log | grep -E "error:|BUILD" || true
          test -f build/dev/Build/Products/Release-iphoneos/HTS.app/HTS
          mkdir -p Payload
          cp -R build/dev/Build/Products/Release-iphoneos/HTS.app Payload/
          # libjvm finds DeviceHasTXM with dlsym, it has to stay exported
          nm -gU Payload/HTS.app/HTS > exports.txt
          grep ' _DeviceHasTXM$' exports.txt || { echo "DeviceHasTXM not exported"; exit 1; }
          bash scripts/pack-jre.sh Payload/HTS.app jre-cache
          bash scripts/pack-game-libs.sh Payload/HTS.app game-cache build/sdl-out/device/libSDL3.dylib build/gltest
          # Ad-hoc signatures and entitlements (as Amethyst): runtimes and libraries first, then the app
          find Payload/HTS.app/java_runtimes Payload/HTS.app/Frameworks -type f | while read -r f; do
              if file -b "$f" | grep -q '^Mach-O'; then ldid -S "$f"; fi
          done
          ldid -Sentitlements.sideload.xml Payload/HTS.app
          ldid -e Payload/HTS.app/HTS
          zip -qry HTS.ipa Payload
          ls -la HTS.ipa

      # The iOS JREs retagged for the simulator: does each JVM start, and does its JIT compile
      - name: Java and rendering in the simulator
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIMAPP=build/sim/Build/Products/Debug-iphonesimulator/HTS.app
          bash scripts/pack-jre.sh "$SIMAPP" jre-cache simulator
          bash scripts/pack-game-libs.sh "$SIMAPP" game-cache build/sdl-out/simulator/libSDL3.dylib build/gltest simulator
          codesign -f -s - "$SIMAPP"
          failed=0
          bash scripts/sim-java-probe.sh "$SIMAPP" java-probe || failed=1
          bash scripts/sim-gltest.sh "$SIMAPP" java-probe || failed=1
          exit $failed

      - uses: actions/upload-artifact@v4
        with:
          name: HTS-ipa
          path: HTS.ipa
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-probe
          path: java-probe
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            *.log
            HTSCore/Package.resolved
          if-no-files-found: ignore
